<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Poker Chip Generator</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background:
            linear-gradient(45deg, #10131a 25%, transparent 25%),
            linear-gradient(-45deg, #10131a 25%, transparent 25%),
            linear-gradient(45deg, transparent 75%, #10131a 75%),
            linear-gradient(-45deg, transparent 75%, #10131a 75%);
        background-size: 16px 16px;
        background-position: 0 0, 0 8px, 8px -8px, -8px 0;
        background-color: #181c25;
        color: #fff;
        font-family: system-ui, sans-serif;
    }

    header {
        padding: 28px 20px 18px;
        text-align: center;
        background: rgba(10, 12, 17, .95);
        border-bottom: 3px solid #3c4352;
    }

    h1 {
        margin: 0;
        font-size: clamp(25px, 5vw, 44px);
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #ffd84a;
        text-shadow: 4px 4px #000;
    }

    header p {
        margin: 8px 0 0;
        color: #9da6b7;
    }

    .app {
        width: min(1300px, 94%);
        margin: 25px auto;
    }

    .controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 14px;
        padding: 18px;
        background: #202531;
        border: 3px solid #414957;
        box-shadow: 8px 8px #080a0e;
    }

    .control {
        display: flex;
        flex-direction: column;
        gap: 7px;
    }

    label {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 1px;
        color: #aeb7c7;
        text-transform: uppercase;
    }

    input,
    select,
    button {
        min-height: 42px;
        border: 2px solid #4a5364;
        background: #11151c;
        color: white;
        padding: 8px 11px;
        font: inherit;
        border-radius: 2px;
    }

    input:focus,
    select:focus {
        outline: 2px solid #ffd84a;
    }

    button {
        cursor: pointer;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 1px;
        background: #343c4b;
        border-color: #697386;
    }

    button:hover {
        background: #485264;
        transform: translate(-1px, -1px);
    }

    button.primary {
        color: #151515;
        background: #ffd84a;
        border-color: #ffe98b;
    }

    button.primary:hover {
        background: #ffe276;
    }

    .actions {
        grid-column: 1 / -1;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 4px;
    }

    .actions button {
        flex: 1 1 180px;
    }

    .chips {
        margin-top: 28px;
        padding: 25px;
        min-height: 400px;
        background: rgba(13, 16, 22, .9);
        border: 3px solid #343b49;
        box-shadow: 8px 8px #080a0e;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 35px;
        align-items: center;
        justify-items: center;
    }

    .chip-card {
        width: 190px;
        text-align: center;
    }

    .chip-wrap {
        position: relative;
        width: 180px;
        height: 180px;
        margin: auto;
    }

    canvas {
        width: 180px;
        height: 180px;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
    }

    .chip-buttons {
        display: flex;
        gap: 5px;
        margin-top: 9px;
    }

    .chip-buttons button {
        min-height: 31px;
        padding: 3px 6px;
        font-size: 9px;
        flex: 1;
    }

    .style-name {
        margin-top: 8px;
        color: #858fa1;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .status {
        text-align: center;
        color: #7d8798;
        font-size: 12px;
        margin-top: 16px;
    }

    .legend {
        margin-top: 22px;
        padding: 15px;
        background: #202531;
        border: 2px solid #3d4554;
        color: #9fa8b8;
        font-size: 13px;
        line-height: 1.6;
    }

    @media (max-width: 600px) {
        .chips {
            padding: 12px;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px 8px;
        }

        .chip-card,
        .chip-wrap,
        canvas {
            width: 145px;
            height: 145px;
        }
    }
</style>
</head>

<body>

<header>
    <h1>Pixel Poker Chips</h1>
    <p>Procedural HTML5 pixel-art chip generator</p>
</header>

<div class="app">

    <section class="controls">

        <div class="control">
            <label>Number of Chips</label>
            <input id="count" type="number" min="1" max="20" value="8">
        </div>

        <div class="control">
            <label>Pixel Resolution</label>
            <select id="resolution">
                <option value="32">32 × 32</option>
                <option value="40" selected>40 × 40</option>
                <option value="48">48 × 48</option>
                <option value="64">64 × 64</option>
            </select>
        </div>

        <div class="control">
            <label>Style</label>
            <select id="style">
                <option value="random">Completely Random</option>
                <option value="classic">Classic Casino</option>
                <option value="neon">Neon</option>
                <option value="arcade">Retro Arcade</option>
                <option value="royal">Royal</option>
                <option value="cyber">Cyberpunk</option>
                <option value="mono">Monochrome</option>
                <option value="gold">Gold</option>
            </select>
        </div>

        <div class="control">
            <label>Pattern</label>
            <select id="pattern">
                <option value="random">Random</option>
                <option value="dots">Dots</option>
                <option value="diamonds">Diamonds</option>
                <option value="stars">Stars</option>
                <option value="bars">Bars</option>
                <option value="cross">Cross</option>
                <option value="none">None</option>
            </select>
        </div>

        <div class="control">
            <label>Seed</label>
            <input id="seed" type="text" placeholder="Random seed">
        </div>

        <div class="control">
            <label>Chip Values</label>
            <select id="values">
                <option value="standard">Standard Poker</option>
                <option value="money">Money</option>
                <option value="casino">Casino</option>
                <option value="random">Random Values</option>
            </select>
        </div>

        <div class="actions">
            <button class="primary" onclick="generateAll()">🎲 Generate Chips</button>
            <button onclick="randomSeed()">🔀 New Random Set</button>
            <button onclick="downloadSheet()">⬇ Download PNG</button>
        </div>

    </section>

    <section id="chips" class="chips"></section>

    <div id="status" class="status"></div>

    <div class="legend">
        <strong>Tip:</strong>
        Change the seed to reproduce a particular set.
        Every chip is generated procedurally, so there are thousands of possible
        combinations of colors, patterns, markings and styles.
    </div>

</div>

<script>
/* =========================================================
   PIXEL POKER CHIP GENERATOR
   ========================================================= */

const STANDARD_VALUES = [
    "$1", "$5", "$25", "$100",
    "$500", "$1K", "$5K", "$25K"
];

const MONEY_VALUES = [
    "$1", "$5", "$10", "$20",
    "$50", "$100", "$500", "$1K"
];

const CASINO_VALUES = [
    "1", "5", "25", "100",
    "500", "1K", "5K", "10K"
];

const RANDOM_VALUES = [
    "1", "5", "10", "25",
    "50", "100", "250", "500",
    "1K", "5K", "10K", "25K"
];

const PALETTES = {
    classic: [
        ["#d92c3d", "#7e1321", "#f5e6c8"],
        ["#2474d9", "#103c76", "#f3e6c7"],
        ["#2fa35b", "#135d32", "#f1e8d0"],
        ["#eee8d5", "#aaa17e", "#17191d"],
        ["#b738d8", "#59127a", "#f4dfff"]
    ],

    neon: [
        ["#ff246f", "#65002d", "#00ffd5"],
        ["#00eaff", "#00445a", "#fffb00"],
        ["#8b5cff", "#28136d", "#ff55e9"],
        ["#4cff36", "#135d0b", "#00ffff"]
    ],

    arcade: [
        ["#ef3e2e", "#68170f", "#f9d94c"],
        ["#3155ff", "#15216d", "#ffcf35"],
        ["#20c997", "#075743", "#fff16b"],
        ["#f58a24", "#73350a", "#fff4ce"]
    ],

    royal: [
        ["#671bc2", "#26065c", "#f5cf54"],
        ["#b11d43", "#500819", "#f7d66a"],
        ["#075c75", "#032f3c", "#e7ce75"],
        ["#14204f", "#080e27", "#e3bd53"]
    ],

    cyber: [
        ["#e900ff", "#45004c", "#00f7ff"],
        ["#00f0ff", "#003c4a", "#ff00a8"],
        ["#72ff00", "#163900", "#00eaff"],
        ["#ff6a00", "#5b2100", "#ffe600"]
    ],

    mono: [
        ["#d8d8d8", "#505050", "#ffffff"],
        ["#999999", "#282828", "#eeeeee"],
        ["#eeeeee", "#606060", "#111111"]
    ],

    gold: [
        ["#d69b18", "#69470b", "#fff0a3"],
        ["#e3b53a", "#76550e", "#fff5b8"],
        ["#bc7e0c", "#513400", "#ffe58a"]
    ]
};

let chips = [];
let globalSeed = "";


/* =========================================================
   SEEDED RANDOM
   ========================================================= */

function hashString(str) {
    let h = 2166136261;

    for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h += (h << 1) + (h << 4) + (h << 7) +
             (h << 8) + (h << 24);
    }

    return h >>> 0;
}

function mulberry32(a) {
    return function() {
        let t = a += 0x6D2B79F5;

        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);

        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}

function randomSeed() {
    globalSeed =
        Math.random().toString(36).substring(2) +
        Date.now().toString(36);

    document.getElementById("seed").value = globalSeed;
    generateAll();
}


/* =========================================================
   UTILITIES
   ========================================================= */

function pick(rng, arr) {
    return arr[Math.floor(rng() * arr.length)];
}

function hexToRgb(hex) {
    hex = hex.replace("#", "");

    return {
        r: parseInt(hex.substring(0, 2), 16),
        g: parseInt(hex.substring(2, 4), 16),
        b: parseInt(hex.substring(4, 6), 16)
    };
}

function shade(hex, amount) {
    const c = hexToRgb(hex);

    c.r = Math.max(0, Math.min(255, c.r + amount));
    c.g = Math.max(0, Math.min(255, c.g + amount));
    c.b = Math.max(0, Math.min(255, c.b + amount));

    return `rgb(${c.r},${c.g},${c.b})`;
}

function getValues() {
    const mode = document.getElementById("values").value;

    if (mode === "money") return MONEY_VALUES;
    if (mode === "casino") return CASINO_VALUES;
    if (mode === "random") return RANDOM_VALUES;

    return STANDARD_VALUES;
}


/* =========================================================
   CHIP GENERATION
   ========================================================= */

function createChip(index, seedOverride = null) {

    const styleChoice = document.getElementById("style").value;
    const patternChoice = document.getElementById("pattern").value;

    const seed =
        (seedOverride || globalSeed || "pixelcasino") +
        "|" + index;

    const rng = mulberry32(hashString(seed));

    let style = styleChoice;

    if (style === "random") {
        style = pick(rng, [
            "classic",
            "neon",
            "arcade",
            "royal",
            "cyber",
            "mono",
            "gold"
        ]);
    }

    const palette = pick(rng, PALETTES[style]);

    let pattern = patternChoice;

    if (pattern === "random") {
        pattern = pick(rng, [
            "dots",
            "diamonds",
            "stars",
            "bars",
            "cross",
            "none"
        ]);
    }

    const values = getValues();

    const value = pick(rng, values);

    const chip = {
        index,
        seed,
        rng,
        style,
        pattern,
        base: palette[0],
        dark: palette[1],
        accent: palette[2],
        value,
        rotation: Math.floor(rng() * 4),
        notches: 8 + Math.floor(rng() * 5),
        innerRing: rng() > .25,
        noise: rng() > .35,
        stars: rng() > .6,
        borderPixels: rng() > .5
    };

    return chip;
}


/* =========================================================
   DRAW CHIP
   ========================================================= */

function drawChip(canvas, chip) {

    const size = parseInt(
        document.getElementById("resolution").value
    );

    canvas.width = size;
    canvas.height = size;

    const ctx = canvas.getContext("2d");

    ctx.imageSmoothingEnabled = false;

    ctx.clearRect(0, 0, size, size);

    const cx = Math.floor(size / 2);
    const cy = Math.floor(size / 2);

    const R = Math.floor(size * .44);

    /* shadow */
    ctx.fillStyle = "#000";
    ctx.globalAlpha = .65;

    circle(ctx, cx + 1, cy + 2, R + 1);

    ctx.globalAlpha = 1;

    /* outer dark edge */
    ctx.fillStyle = chip.dark;
    circle(ctx, cx, cy, R);

    /* outer highlight */
    ctx.fillStyle = shade(chip.base, 22);
    circle(ctx, cx, cy - 1, R - 1);

    /* base */
    ctx.fillStyle = chip.base;
    circle(ctx, cx, cy, R - 2);

    /* edge notches */
    drawNotches(ctx, chip, cx, cy, R);

    /* outer ring */
    ctx.strokeStyle = chip.accent;
    ctx.lineWidth = Math.max(1, Math.floor(size / 18));

    circleStroke(
        ctx,
        cx,
        cy,
        Math.floor(R * .75)
    );

    /* pattern */
    drawPattern(
        ctx,
        chip,
        cx,
        cy,
        Math.floor(R * .78)
    );

    /* center disc */
    ctx.fillStyle = shade(chip.base, -10);

    circle(
        ctx,
        cx,
        cy,
        Math.floor(R * .53)
    );

    /* center ring */
    ctx.strokeStyle = chip.accent;
    ctx.lineWidth = Math.max(1, Math.floor(size / 20));

    circleStroke(
        ctx,
        cx,
        cy,
        Math.floor(R * .48)
    );

    /* value */
    drawPixelText(
        ctx,
        chip.value,
        cx,
        cy,
        chip.accent,
        size
    );

    /* pixel highlights */
    drawHighlights(ctx, chip, cx, cy, R);

    /* noise */
    if (chip.noise) {
        drawNoise(ctx, chip, cx, cy, R, size);
    }

    /* tiny glint */
    ctx.fillStyle = "rgba(255,255,255,.7)";

    ctx.fillRect(
        cx - Math.floor(R * .45),
        cy - Math.floor(R * .58),
        2,
        2
    );
}


/* =========================================================
   BASIC SHAPES
   ========================================================= */

function circle(ctx, x, y, r) {

    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
}

function circleStroke(ctx, x, y, r) {

    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();
}


/* =========================================================
   EDGE NOTCHES
   ========================================================= */

function drawNotches(ctx, chip, cx, cy, R) {

    const count = chip.notches;

    for (let i = 0; i < count; i++) {

        const a =
            (Math.PI * 2 * i / count) +
            chip.rotation * .08;

        const x = Math.round(
            cx + Math.cos(a) * (R - 1)
        );

        const y = Math.round(
            cy + Math.sin(a) * (R - 1)
        );

        ctx.save();

        ctx.translate(x, y);
        ctx.rotate(a);

        ctx.fillStyle = chip.accent;

        ctx.fillRect(
            -2,
            -1,
            4,
            2
        );

        ctx.restore();
    }
}


/* =========================================================
   PATTERNS
   ========================================================= */

function drawPattern(ctx, chip, cx, cy, radius) {

    ctx.save();

    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.clip();

    ctx.fillStyle = chip.accent;

    if (chip.pattern === "dots") {

        for (let y = cy - radius; y <= cy + radius; y += 5) {

            for (let x = cx - radius; x <= cx + radius; x += 5) {

                if (
                    Math.sqrt(
                        (x-cx)**2 +
                        (y-cy)**2
                    ) < radius
                ) {
                    ctx.fillRect(x, y, 2, 2);
                }
            }
        }
    }

    else if (chip.pattern === "diamonds") {

        for (
            let y = cy - radius;
            y <= cy + radius;
            y += 7
        ) {

            for (
                let x = cx - radius;
                x <= cx + radius;
                x += 7
            ) {

                ctx.fillRect(x, y, 3, 3);
                ctx.fillRect(x + 1, y - 1, 1, 5);
                ctx.fillRect(x - 1, y + 1, 5, 1);
            }
        }
    }

    else if (chip.pattern === "bars") {

        for (
            let x = cx - radius;
            x < cx + radius;
            x += 7
        ) {
            ctx.fillRect(
                x,
                cy - radius,
                3,
                radius * 2
            );
        }
    }

    else if (chip.pattern === "cross") {

        ctx.fillRect(
            cx - radius,
            cy - 1,
            radius * 2,
            2
        );

        ctx.fillRect(
            cx - 1,
            cy - radius,
            2,
            radius * 2
        );
    }

    else if (chip.pattern === "stars") {

        for (let i = 0; i < 12; i++) {

            const a = i * Math.PI / 6;

            const x = Math.round(
                cx + Math.cos(a) * radius * .62
            );

            const y = Math.round(
                cy + Math.sin(a) * radius * .62
            );

            drawStar(ctx, x, y, 2);
        }
    }

    ctx.restore();
}

function drawStar(ctx, x, y, r) {

    ctx.fillRect(x - r, y, r * 2 + 1, 1);
    ctx.fillRect(x, y - r, 1, r * 2 + 1);
}


/* =========================================================
   TEXT
   ========================================================= */

const FONT = {
    "0": [
        "111",
        "101",
        "101",
        "101",
        "111"
    ],
    "1": [
        "010",
        "110",
        "010",
        "010",
        "111"
    ],
    "2": [
        "111",
        "001",
        "111",
        "100",
        "111"
    ],
    "3": [
        "111",
        "001",
        "111",
        "001",
        "111"
    ],
    "4": [
        "101",
        "101",
        "111",
        "001",
        "001"
    ],
    "5": [
        "111",
        "100",
        "111",
        "001",
        "111"
    ],
    "6": [
        "111",
        "100",
        "111",
        "101",
        "111"
    ],
    "7": [
        "111",
        "001",
        "010",
        "010",
        "010"
    ],
    "8": [
        "111",
        "101",
        "111",
        "101",
        "111"
    ],
    "9": [
        "111",
        "101",
        "111",
        "001",
        "111"
    ],
    "$": [
        "010",
        "111",
        "100",
        "111",
        "010"
    ],
    "K": [
        "101",
        "110",
        "100",
        "110",
        "101"
    ]
};

function drawPixelText(
    ctx,
    text,
    cx,
    cy,
    color,
    size
) {

    text = text.toUpperCase();

    const scale =
        size >= 60 ? 2 : 1;

    const charWidth = 4 * scale;

    const totalWidth =
        text.length * charWidth;

    let startX =
        Math.floor(cx - totalWidth / 2);

    const startY =
        Math.floor(cy - 3 * scale);

    ctx.fillStyle = color;

    for (const char of text) {

        const glyph = FONT[char];

        if (!glyph) {
            startX += charWidth;
            continue;
        }

        for (let y = 0; y < glyph.length; y++) {

            for (let x = 0; x < glyph[y].length; x++) {

                if (glyph[y][x] === "1") {

                    ctx.fillRect(
                        startX + x * scale,
                        startY + y * scale,
                        scale,
                        scale
                    );
                }
            }
        }

        startX += charWidth;
    }
}


/* =========================================================
   HIGHLIGHTS / NOISE
   ========================================================= */

function drawHighlights(ctx, chip, cx, cy, R) {

    ctx.fillStyle = shade(chip.base, 35);

    for (let i = 0; i < 8; i++) {

        const a =
            -2.7 + i * .09;

        const x =
            Math.round(cx + Math.cos(a) * R * .78);

        const y =
            Math.round(cy + Math.sin(a) * R * .78);

        ctx.fillRect(x, y, 2, 2);
    }
}

function drawNoise(ctx, chip, cx, cy, R, size) {

    const rng =
        mulberry32(hashString(chip.seed + "|noise"));

    const amount =
        Math.floor(size * size * .035);

    for (let i = 0; i < amount; i++) {

        const x =
            Math.floor(rng() * size);

        const y =
            Math.floor(rng() * size);

        if (
            Math.sqrt(
                (x-cx)**2 +
                (y-cy)**2
            ) < R
        ) {

            ctx.fillStyle =
                rng() > .5
                    ? "rgba(255,255,255,.08)"
                    : "rgba(0,0,0,.10)";

            ctx.fillRect(x, y, 1, 1);
        }
    }
}


/* =========================================================
   UI
   ========================================================= */

function generateAll() {

    const seedInput =
        document.getElementById("seed");

    globalSeed =
        seedInput.value.trim() ||
        "pixel-" + Math.random().toString(36).slice(2);

    seedInput.value = globalSeed;

    const count =
        Math.max(
            1,
            Math.min(
                20,
                parseInt(
                    document.getElementById("count").value
                ) || 8
            )
        );

    chips = [];

    const container =
        document.getElementById("chips");

    container.innerHTML = "";

    for (let i = 0; i < count; i++) {

        const chip =
            createChip(i);

        chips.push(chip);

        addChipCard(chip);
    }

    document.getElementById("status").textContent =
        `${count} chips generated • seed: ${globalSeed}`;
}

function addChipCard(chip) {

    const card =
        document.createElement("div");

    card.className = "chip-card";

    const wrap =
        document.createElement("div");

    wrap.className = "chip-wrap";

    const canvas =
        document.createElement("canvas");

    drawChip(canvas, chip);

    wrap.appendChild(canvas);

    const style =
        document.createElement("div");

    style.className = "style-name";

    style.textContent =
        `${chip.style} • ${chip.pattern}`;

    const buttons =
        document.createElement("div");

    buttons.className = "chip-buttons";

    const regen =
        document.createElement("button");

    regen.textContent = "↻ Reroll";

    regen.onclick = () => {

        const newChip =
            createChip(
                chip.index,
                globalSeed +
                "|reroll|" +
                Date.now()
            );

        chips[chip.index] = newChip;

        drawChip(canvas, newChip);

        style.textContent =
            `${newChip.style} • ${newChip.pattern}`;
    };

    const download =
        document.createElement("button");

    download.textContent = "PNG";

    download.onclick = () =>
        downloadChip(canvas, chip.value);

    buttons.appendChild(regen);
    buttons.appendChild(download);

    card.appendChild(wrap);
    card.appendChild(style);
    card.appendChild(buttons);

    document
        .getElementById("chips")
        .appendChild(card);
}


/* =========================================================
   DOWNLOAD
   ========================================================= */

function downloadChip(canvas, value) {

    const link =
        document.createElement("a");

    link.download =
        `pixel-chip-${value.replace("$", "")}.png`;

    link.href =
        canvas.toDataURL("image/png");

    link.click();
}

function downloadSheet() {

    if (!chips.length) return;

    const size =
        parseInt(
            document.getElementById("resolution").value
        );

    const scale = 5;

    const gap = 8;

    const columns = 4;

    const rows =
        Math.ceil(chips.length / columns);

    const sheet =
        document.createElement("canvas");

    sheet.width =
        columns * (size + gap) + gap;

    sheet.height =
        rows * (size + gap) + gap;

    const ctx =
        sheet.getContext("2d");

    ctx.imageSmoothingEnabled = false;

    ctx.fillStyle = "#10131a";

    ctx.fillRect(
        0,
        0,
        sheet.width,
        sheet.height
    );

    chips.forEach((chip, i) => {

        const c =
            document.createElement("canvas");

        drawChip(c, chip);

        const x =
            gap +
            (i % columns) *
            (size + gap);

        const y =
            gap +
            Math.floor(i / columns) *
            (size + gap);

        ctx.drawImage(
            c,
            x,
            y
        );
    });

    const link =
        document.createElement("a");

    link.download =
        "pixel-poker-chip-sheet.png";

    link.href =
        sheet.toDataURL("image/png");

    link.click();
}


/* =========================================================
   INITIALIZE
   ========================================================= */

globalSeed =
    "casino-" +
    Math.random()
        .toString(36)
        .substring(2, 9);

document.getElementById("seed").value =
    globalSeed;

generateAll();

</script>
