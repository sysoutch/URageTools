<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprite Idle / Jump Animator</title>
<style>
:root{--bg:#0f1117;--panel:#181b23;--panel2:#222631;--line:#303646;--text:#f3f5f8;--muted:#aeb6c5;--accent:#85a2ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.app{display:grid;grid-template-columns:330px 1fr;min-height:100vh}
aside{padding:18px;background:var(--panel);border-right:1px solid var(--line);overflow:auto}
main{display:grid;place-items:center;padding:24px}
h1{font-size:20px;margin:0 0 4px}
p{margin:0 0 14px;color:var(--muted)}
.group{padding-top:14px;margin-top:14px;border-top:1px solid var(--line)}
label{display:block;margin:9px 0 5px}
select,input,button{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text)}
input[type=range]{padding:0}
.row{display:grid;grid-template-columns:1fr 72px;gap:8px;align-items:center}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
button{cursor:pointer;font-weight:700}
button.primary{background:var(--accent);color:#10131a;border-color:transparent}
.stage{width:min(78vw,900px);aspect-ratio:16/10;background:#0a0c11;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.35)}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.small{font-size:12px;color:var(--muted);margin-top:8px}
@media(max-width:800px){.app{grid-template-columns:1fr}.stage{width:94vw}aside{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<div class="app">
<aside>
  <h1>Sprite Animator</h1>
  <p>Upload one sprite, then fake an idle or jump animation using clean canvas transforms.</p>

  <label>Sprite image</label>
  <input id="file" type="file" accept="image/png,image/webp,image/gif,image/jpeg">

  <div class="group">
    <label>Animation</label>
    <select id="mode">
      <option value="idle">Idle</option>
      <option value="jump">Jump</option>
    </select>

    <label>Frames</label>
    <div class="row"><input id="frames" type="range" min="4" max="24" value="8"><input id="framesN" type="number" min="4" max="24" value="8"></div>

    <label>FPS</label>
    <div class="row"><input id="fps" type="range" min="4" max="30" value="10"><input id="fpsN" type="number" min="4" max="30" value="10"></div>
  </div>

  <div class="group">
    <label>Motion amount</label>
    <div class="row"><input id="motion" type="range" min="0" max="40" value="12"><input id="motionN" type="number" min="0" max="40" value="12"></div>

    <label>Squash / stretch</label>
    <div class="row"><input id="squash" type="range" min="0" max="30" value="8"><input id="squashN" type="number" min="0" max="30" value="8"></div>

    <label>Lean / rotation</label>
    <div class="row"><input id="lean" type="range" min="0" max="20" value="3"><input id="leanN" type="number" min="0" max="20" value="3"></div>
  </div>

  <div class="group">
    <label><input id="shadow" type="checkbox" checked style="width:auto"> Ground shadow</label>
    <label><input id="checker" type="checkbox" checked style="width:auto"> Transparency checkerboard</label>
    <div class="buttons">
      <button id="play" class="primary">Pause</button>
      <button id="reset">Reset</button>
    </div>
    <div class="buttons">
      <button id="export">Export PNG sheet</button>
      <button id="downloadHtml">Save tool</button>
    </div>
    <div class="small">Export creates a horizontal sprite sheet containing the generated frames.</div>
  </div>
</aside>

<main>
  <div class="stage"><canvas id="canvas" width="900" height="562"></canvas></div>
</main>
</div>

<script>
const $=id=>document.getElementById(id);
const canvas=$('canvas'), ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;

let img=null, playing=true, t0=performance.now();

function bindPair(a,b){
  const A=$(a),B=$(b);
  A.oninput=()=>B.value=A.value;
  B.oninput=()=>A.value=B.value;
}
bindPair('frames','framesN'); bindPair('fps','fpsN');
bindPair('motion','motionN'); bindPair('squash','squashN'); bindPair('lean','leanN');

$('file').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const u=URL.createObjectURL(f), im=new Image();
  im.onload=()=>{img=im;URL.revokeObjectURL(u)};
  im.src=u;
};

$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play'; if(playing)t0=performance.now()};
$('reset').onclick=()=>{t0=performance.now()};
$('downloadHtml').onclick=()=>{
  const blob=new Blob([document.documentElement.outerHTML],{type:'text/html'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sprite-animator.html';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};

function checker(){
  if(!$('checker').checked){ctx.fillStyle='#11151d';ctx.fillRect(0,0,canvas.width,canvas.height);return}
  const s=24;
  for(let y=0;y<canvas.height;y+=s)for(let x=0;x<canvas.width;x+=s){
    ctx.fillStyle=((x/s+y/s)&1)?'#171a21':'#20242d';ctx.fillRect(x,y,s,s)
  }
}

function paramsAt(p){
  const mode=$('mode').value;
  const motion=+$('motion').value, squash=+$('squash').value/100, lean=+$('lean').value*Math.PI/180;
  if(mode==='idle'){
    const s=Math.sin(p*Math.PI*2), c=Math.cos(p*Math.PI*2);
    return {
      y:-Math.abs(s)*motion*.45,
      sx:1 + c*squash*.25,
      sy:1 - c*squash*.25,
      rot:s*lean*.35,
      shadow:1-Math.abs(s)*.12
    };
  } else {
    const arc=Math.sin(p*Math.PI);
    const landing=Math.max(0,1-Math.abs(p-.5)*10);
    return {
      y:-arc*motion*3,
      sx:1 - arc*squash*.25 + landing*squash*.35,
      sy:1 + arc*squash*.35 - landing*squash*.3,
      rot:(p-.5)*lean*1.3,
      shadow:1-arc*.45
    };
  }
}

function drawFrame(targetCtx,w,h,p,clear=true){
  if(clear) targetCtx.clearRect(0,0,w,h);
  if(!img){
    targetCtx.fillStyle='#9aa6ba';targetCtx.font='20px system-ui';targetCtx.textAlign='center';
    targetCtx.fillText('Upload a sprite PNG to begin',w/2,h/2);return;
  }

  const q=paramsAt(p);
  const maxW=w*.42,maxH=h*.55;
  const scale=Math.min(maxW/img.width,maxH/img.height);
  const iw=img.width*scale, ih=img.height*scale;
  const cx=w/2, ground=h*.79;

  if($('shadow').checked){
    targetCtx.save();
    targetCtx.globalAlpha=.24;
    targetCtx.fillStyle='#000';
    targetCtx.beginPath();
    targetCtx.ellipse(cx,ground+8,iw*.34*q.shadow,Math.max(5,ih*.055*q.shadow),0,0,Math.PI*2);
    targetCtx.fill();
    targetCtx.restore();
  }

  targetCtx.save();
  targetCtx.translate(cx,ground+q.y);
  targetCtx.rotate(q.rot);
  targetCtx.scale(q.sx,q.sy);
  targetCtx.imageSmoothingEnabled=false;
  targetCtx.drawImage(img,-iw/2,-ih,iw,ih);
  targetCtx.restore();
}

function render(now){
  checker();
  const fps=+$('fps').value, frames=+$('frames').value;
  const elapsed=(now-t0)/1000;
  const frame=playing?Math.floor(elapsed*fps)%frames:0;
  const p=frame/frames;
  drawFrame(ctx,canvas.width,canvas.height,p,false);
  requestAnimationFrame(render);
}
requestAnimationFrame(render);

$('export').onclick=()=>{
  if(!img){alert('Upload a sprite first. Humanity must still provide at least one pixel.');return}
  const n=+$('frames').value;
  const cell=256;
  const out=document.createElement('canvas');
  out.width=cell*n; out.height=cell;
  const c=out.getContext('2d'); c.imageSmoothingEnabled=false;
  for(let i=0;i<n;i++) drawFrame(c,cell,cell,i/n,false);
  out.toBlob(blob=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`${$('mode').value}-spritesheet-${n}f.png`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  });
};
</script>
</body>
</html>
