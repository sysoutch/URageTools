<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="x-ua-compatible" content="ie=edge">

  <!-- Shared libs -->
  <link rel="stylesheet" href="../../shared/libs/fontawesome/css/fontawesome.css">
  <link rel="stylesheet" href="../../shared/libs/fontawesome/css/brands.css">
  <link rel="stylesheet" href="../../shared/libs/fontawesome/css/solid.css">

  <!-- Tab bar styles -->
  <link rel="stylesheet" href="css/tab-bar.css">
<title>Map Generator | URage Tools</title>
<link rel="canonical" href="https://urage.net/tools/dev/map-generator/">
<meta name="description" content="Build maps with integrated 2D and 3D generators and switch between both workspaces.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="URage Tools">
<meta property="og:url" content="https://urage.net/tools/dev/map-generator/">
<meta property="og:title" content="Map Generator | URage Tools">
<meta property="og:description" content="Build maps with integrated 2D and 3D generators and switch between both workspaces.">
<meta property="og:image" content="https://urage.net/tools/dev/map-generator/thumbnail.png">
<meta property="og:image:alt" content="Map Generator preview">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Map Generator | URage Tools">
<meta name="twitter:description" content="Build maps with integrated 2D and 3D generators and switch between both workspaces.">
<meta name="twitter:image" content="https://urage.net/tools/dev/map-generator/thumbnail.png">
</head>
<body data-dashboard-theme="fire">
  <div class="map-generator-app">
    <!-- Tab Bar -->
    <div class="tab-bar" role="tablist" data-dashboard-tool-sidebar data-dashboard-tool-sidebar-label="Map Generator Controls" data-dashboard-tool-sidebar-include-nested="active">
      <button class="tab-btn active" id="tab2d" type="button" role="tab" aria-selected="true" onclick="switchTab('2D')">
        <i class="fas fa-border-all"></i> 2D Map
      </button>
      <button class="tab-btn" id="tab3d" type="button" role="tab" aria-selected="false" onclick="switchTab('3D')">
        <i class="fas fa-cubes"></i> 3D Map
      </button>
      <div class="tab-bar-status" aria-live="polite"><span id="mapSyncStatus">Views stay in sync</span></div>
      <button id="syncMapButton" type="button">Sync view</button>
    </div>

    <!-- Tab Content -->
    <div class="tab-content">

      <!-- ==================== 2D MAP PANEL ==================== -->
      <div id="panel2d" class="tab-panel active">
        <iframe src="2d/index.html" title="2D Map Generator"></iframe>
      </div>

      <!-- ==================== 3D MAP PANEL ==================== -->
      <div id="panel3d" class="tab-panel">
        <iframe src="3d/index.html" title="3D Map Generator"></iframe>
      </div>

    </div><!-- /tab-content -->
  </div><!-- /map-generator-app -->

  <!-- Tab switching logic -->
  <script src="../../shared/dashboard-theme.js"></script>
  <script src="../../shared/dashboard-current-output-autodescribe.js"></script>
  <script src="../../shared/dashboard-tool-bridge.js"></script>
  <script src="js/tab-bar.js"></script>

</body>
</html>
