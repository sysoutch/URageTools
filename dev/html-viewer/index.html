<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="../../shared/dashboard-theme.js"></script>
    <link rel="stylesheet" href="style.css">
<title>Html Viewer | URage Tools</title>
<link rel="canonical" href="https://urage.net/tools/dev/html-viewer/">
<meta name="description" content="A simple tool to view and preview HTML files directly in your browser with live reloading capabilities.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="URage Tools">
<meta property="og:url" content="https://urage.net/tools/dev/html-viewer/">
<meta property="og:title" content="Html Viewer | URage Tools">
<meta property="og:description" content="A simple tool to view and preview HTML files directly in your browser with live reloading capabilities.">
<meta property="og:image" content="https://urage.net/tools/dev/html-viewer/thumbnail.png">
<meta property="og:image:alt" content="Html Viewer preview">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Html Viewer | URage Tools">
<meta name="twitter:description" content="A simple tool to view and preview HTML files directly in your browser with live reloading capabilities.">
<meta name="twitter:image" content="https://urage.net/tools/dev/html-viewer/thumbnail.png">
</head>
<body data-dashboard-theme="fire">

    <div class="header">
        <h1>LIVE PREVIEW</h1>
        <div class="header-actions">
            <small id="status" style="color: var(--muted);">Ready</small>
            <button class="share-btn" onclick="shareProject()">SHARE</button>
        </div>
    </div>

    <div class="container">
        <div class="editors">
            <div class="editor-group">
                <label>HTML</label>
                <textarea id="html-code" spellcheck="false" oninput="debouncedUpdate()"></textarea>
            </div>
            
            <div class="editor-group">
                <label>CSS</label>
                <textarea id="css-code" spellcheck="false" oninput="debouncedUpdate()"></textarea>
            </div>
            
            <div class="editor-group">
                <label>JavaScript</label>
                <textarea id="js-code" spellcheck="false" oninput="debouncedUpdate()"></textarea>
            </div>
        </div>

        <div class="preview-side">
            <iframe id="output"></iframe>
        </div>
    </div>

    <script src="script.js"></script>
  <script src="../../shared/dashboard-current-output-autodescribe.js"></script>


</body>
</html>
