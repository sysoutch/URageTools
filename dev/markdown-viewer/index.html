<body data-dashboard-theme="fire">
    <div class="file-input">
        <h2>README Viewer</h2>
        <p>Select a README.md file to display</p>
        <label class="upload-btn" for="fileInput">
          <span class="upload-btn-icon">📄</span>
          <span class="upload-btn-text">Upload Markdown File (.md)</span>
          <input type="file" id="fileInput" accept=".md" hidden>
        </label>
        <br>
        <button onclick="loadFile()">Load README</button>
    </div>
    <div id="readmeContent" class="readme-content" style="display: none;"></div>

    <script src="js/markdown-parser.js"></script>
