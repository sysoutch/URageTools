<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Metadata Remover</title>
    <script src="../../shared/dashboard-theme.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body data-dashboard-theme="fire">

<h1>🧹 Image Metadata Remover</h1>
<p class="subtitle">Strip EXIF, IPTC, XMP &amp; all hidden metadata from your images — right in the browser.</p>

<!-- Drop Zone -->
<div class="drop-zone" id="dropZone">
    <svg viewBox="0 0 24 24"><path d="M19.35 10.04A7.49 7.49 0 0 0 12 4C8.11 4 5 7.11 5 11.26c0 1.07.23 2.08.64 2.98L1 19l4.02-1.64A7.49 7.49 0 0 0 12 19c3.89 0 7-3.11 7-7 0-1.85-.72-3.58-1.95-4.96zM14 13v4h4v-4h-3V9h-2v4h-3l3 3 3-3z"/></svg>
    <p>Drag &amp; drop an image here, or <span class="highlight">click to browse</span></p>
    <input type="file" id="fileInput" accept="image/*">
</div>

<!-- Results -->
<div class="results" id="results">

    <!-- Stats -->
    <div class="stats-bar" id="statsBar"></div>

    <!-- Comparison -->
    <div class="comparison">
        <div class="card">
            <div class="card-header original">
                Original
                <span class="badge" id="origSizeBadge"></span>
            </div>
            <div class="card-body"><img id="originalPreview" alt="Original"></div>
        </div>
        <div class="card">
            <div class="card-header cleaned">
                Cleaned (Metadata Removed)
                <span class="badge" id="cleanSizeBadge"></span>
            </div>
            <div class="card-body"><canvas id="cleanCanvas"></canvas></div>
        </div>
    </div>

    <!-- Metadata Details -->
    <div class="meta-section">
        <h3>📋 Metadata Analysis</h3>
        <table class="meta-table" id="metaTable">
            <thead><tr><th>Tag</th><th>Status</th></tr></thead>
            <tbody id="metaBody"></tbody>
        </table>
    </div>

    <!-- Format & Quality -->
    <div class="format-row">
        <label for="formatSelect">Output format:</label>
        <select id="formatSelect">
            <option value="image/png" selected>PNG (lossless)</option>
            <option value="image/jpeg">JPEG</option>
            <option value="image/webp">WebP</option>
        </select>
    </div>
    <div class="quality-row" id="qualityRow" style="display:none;">
        <label for="qualitySlider">Quality:</label>
        <input type="range" id="qualitySlider" min="10" max="100" value="92">
        <span id="qualityValue" style="color:#6ee7b7;font-weight:600;">92%</span>
    </div>

    <!-- Actions -->
    <div class="actions">
        <button class="btn btn-secondary" id="resetBtn">🔄 Process Another</button>
        <button class="btn btn-primary" id="downloadBtn">⬇ Download Clean Image</button>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="script.js"></script>
<script src="../../shared/dashboard-current-output-autodescribe.js"></script>
</body>
</html>
