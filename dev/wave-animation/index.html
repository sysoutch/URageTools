<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="../../shared/dashboard-theme.js"></script>
    <link rel="stylesheet" href="style.css">
<title>Wave Animation | URage Tools</title>
<link rel="canonical" href="https://urage.net/tools/dev/wave-animation/">
<meta name="description" content="Create beautiful, animated wave effects for your web pages using CSS and JavaScript.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="URage Tools">
<meta property="og:url" content="https://urage.net/tools/dev/wave-animation/">
<meta property="og:title" content="Wave Animation | URage Tools">
<meta property="og:description" content="Create beautiful, animated wave effects for your web pages using CSS and JavaScript.">
<meta property="og:image" content="https://urage.net/tools/dev/wave-animation/thumbnail.png">
<meta property="og:image:alt" content="Wave Animation preview">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Wave Animation | URage Tools">
<meta name="twitter:description" content="Create beautiful, animated wave effects for your web pages using CSS and JavaScript.">
<meta name="twitter:image" content="https://urage.net/tools/dev/wave-animation/thumbnail.png">
</head>
<body data-dashboard-theme="fire">

    <aside class="controls" data-dashboard-tool-sidebar data-dashboard-tool-sidebar-label="Wave Controls">
        <h1 style="font-size: 1rem; color: var(--primary);">STUDIO GLOW</h1>
        
        <div class="control-group">
            <label>Master Engine</label>
            <select id="engineMode">
                <option value="waves">Wave Physics</option>
                <option value="particles">Particle Grid</option>
            </select>
        </div>

        <h2>Presets</h2>
        <div class="control-group">
            <select id="presetSelect">
                <option value="lava">Volcanic Lava</option>
                <option value="ocean">Deep Ocean</option>
                <option value="cyber">Cyberpunk Neon</option>
                <option value="custom">-- Custom --</option>
            </select>
        </div>

        <h2>Active Colors</h2>
        <div id="color-stack"></div>
        <button class="btn-add" id="addColor">+ New Color</button>

        <div id="wave-only-ui">
            <h2>Physics & Motion</h2>
            <div class="control-group">
                <label>Wave Speed</label>
                <input type="range" id="waveSpeed" min="0" max="100" value="50">
            </div>
            <div class="control-group">
                <label>Fill Level</label>
                <input type="range" id="baseRange" min="10" max="90" value="65">
            </div>
            <div class="control-group">
                <label>Wave Intensity</label>
                <input type="range" id="waveIntensity" min="5" max="80" value="30">
            </div>
        </div>

        <div id="code-output"></div>
    </aside>

    <main id="viewport">
        <canvas id="mainCanvas"></canvas>
    </main>

    <script src="script.js"></script>
  <script src="../../shared/dashboard-current-output-autodescribe.js"></script>

</body>
</html>
