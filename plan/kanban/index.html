<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowState Pro | Full Sortable</title>
    <script src="../../shared/dashboard-theme.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body data-dashboard-theme="fire">

    <div class="app-wrapper">
    <nav>
        <div class="nav-logo">FlowState Pro</div>
        <div class="nav-section">
            <div class="nav-label">Workspace</div>
            <div id="sidebar-list"></div>
            <button class="add-board-btn" onclick="addBoard()">+ New Board</button>
        </div>
    </nav>

    <main>
        <header>
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" id="searchBar" placeholder="Search tasks..." oninput="filterCards()">
            </div>
            <div class="toolbar">
                <button class="btn btn-primary" onclick="addColumn()">+ Add Column</button>
            </div>
        </header>

        <div class="board-canvas" id="canvas" ondragover="handleCanvasDragOver(event)"></div>
    </main>
    </div>

    <div id="modal-overlay" onclick="closeModal()">
        <div class="modal" onclick="event.stopPropagation()">
            <h2 style="margin-bottom: 15px;">Task Details</h2>
            <label>Title</label>
            <input type="text" id="m-title">
            <label>Priority</label>
            <select id="m-priority">
                <option value="low">Low</option>
                <option value="med">Medium</option>
                <option value="high">High</option>
            </select>
            <label>Tag</label>
            <input type="text" id="m-tag">
            <label>Due Date</label>
            <input type="date" id="m-date">
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="btn btn-primary" style="flex: 1;" onclick="saveTask()">Save Task</button>
                <button class="btn" style="background: #ef4444; color: white;" onclick="deleteTask()">Delete</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
  <script src="../../shared/dashboard-current-output-autodescribe.js"></script>

</body>
</html>
