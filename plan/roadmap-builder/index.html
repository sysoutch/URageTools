<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadmap Builder</title>
    <script src="../../shared/dashboard-theme.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body data-dashboard-theme="fire">
    <header class="header" data-dashboard-tool-sidebar data-dashboard-tool-sidebar-label="Roadmap Controls">
        <div style="display: flex; align-items: center; gap: 15px;">
            <h2 style="margin:0; color: var(--primary)">Roadmap Studio</h2>
            <div class="btn-group">
                <button onclick="toggleLayout()">⇄ Switch View</button>
            </div>
        </div>
        <div class="btn-group">
            <button class="primary" onclick="addItem()">+ Add Milestone</button>
            <button onclick="clearAll()" style="color: var(--danger)">Clear All</button>
        </div>
    </header>

    <div class="canvas">
        <div id="roadmap" class="roadmap vertical"></div>
    </div>

    <script src="script.js"></script>
  <script src="../../shared/dashboard-current-output-autodescribe.js"></script>

</body>
</html>
