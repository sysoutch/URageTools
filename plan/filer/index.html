<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Analytics Pro | Advanced Data View</title>
    <script src="../../shared/dashboard-theme.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen pb-12" data-dashboard-theme="fire">

    <div class="max-w-7xl mx-auto px-4 py-8">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-slate-800">Project <span class="text-blue-600">Analytics</span></h1>
                <p class="text-slate-500 text-sm mt-1">Advanced sorting, grouping, and SLOC analysis.</p>
            </div>
            
            <input type="file" id="folderInput" webkitdirectory directory multiple class="hidden">
            
            <button id="scanBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-semibold transition-all shadow-md flex items-center gap-2">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="icons.svg#folder"></use></svg>
                Select Directory
            </button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 mb-6">
            <div class="lg:col-span-3 grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Total Files</p>
                    <p id="statFiles" class="text-2xl font-bold mt-1 text-slate-800">0</p>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Total SLOC</p>
                    <p id="statLines" class="text-2xl font-bold mt-1 text-blue-600">0</p>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Total Size</p>
                    <p id="statSize" class="text-2xl font-bold mt-1 text-slate-800">0 KB</p>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">System Status</p>
                    <p id="statStatus" class="text-sm font-bold mt-2 text-slate-400">Awaiting input...</p>
                    <div class="w-full bg-slate-100 rounded-full h-1.5 mt-2 overflow-hidden">
                        <div id="progressBar" class="bg-blue-600 h-1.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-center items-center h-full min-h-[140px]">
                <canvas id="typeChart"></canvas>
            </div>
        </div>

        <div class="bg-white p-4 rounded-t-xl border border-slate-200 border-b-0 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="relative w-full md:w-1/3">
                <input type="text" id="searchInput" placeholder="Search files..." class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm transition-all">
                <svg class="absolute left-3 top-2.5 text-slate-400" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="icons.svg#search"></use></svg>
            </div>
            
            <div class="flex items-center gap-3 w-full md:w-auto">
                <label class="text-sm font-medium text-slate-500 whitespace-nowrap">Group By:</label>
                <select id="groupBySelect" class="bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2 outline-none">
                    <option value="none">None (Flat List)</option>
                    <option value="ext">File Extension</option>
                    <option value="folder">Top Level Folder</option>
                </select>
                <button id="exportBtn" class="ml-2 text-sm font-medium text-slate-600 hover:text-blue-600 px-4 py-2 border border-slate-200 rounded-lg bg-white hover:bg-slate-50 transition-colors shadow-sm">Export CSV</button>
            </div>
        </div>

        <div class="bg-white rounded-b-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto max-h-[600px] custom-scrollbar">
                <table class="w-full text-left border-collapse whitespace-nowrap">
                    <thead class="bg-slate-100 sticky top-0 z-10 shadow-sm text-xs font-bold text-slate-500 uppercase tracking-wider">
                        <tr>
                            <th class="px-6 py-4 cursor-pointer hover:bg-slate-200 transition-colors sortable" data-sort="name">
                                File Path <svg class="sort-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="icons.svg#chevron-down"></use></svg>
                            </th>
                            <th class="px-6 py-4 cursor-pointer hover:bg-slate-200 transition-colors sortable" data-sort="ext">
                                Type <svg class="sort-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="icons.svg#chevron-down"></use></svg>
                            </th>
                            <th class="px-6 py-4 cursor-pointer hover:bg-slate-200 transition-colors sortable text-right sorted-desc" data-sort="lines">
                                Lines <svg class="sort-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="icons.svg#chevron-down"></use></svg>
                            </th>
                            <th class="px-6 py-4 cursor-pointer hover:bg-slate-200 transition-colors sortable text-right" data-sort="size">
                                Size <svg class="sort-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="icons.svg#chevron-down"></use></svg>
                            </th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody" class="divide-y divide-slate-100">
                        <tr><td colspan="4" class="text-center py-12 text-slate-400">Click "Select Directory" to begin analysis</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
  <script src="../../shared/dashboard-current-output-autodescribe.js"></script>

</body>
</html>
