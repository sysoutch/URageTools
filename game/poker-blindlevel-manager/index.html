<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="../../shared/dashboard-theme.js"></script>
    <link rel="stylesheet" href="style.css">
<title>Poker Blindlevel Manager | URage Tools</title>
<link rel="canonical" href="https://urage.net/tools/game/poker-blindlevel-manager/">
<meta name="description" content="Manage blinds and levels for your home poker tournaments.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="URage Tools">
<meta property="og:url" content="https://urage.net/tools/game/poker-blindlevel-manager/">
<meta property="og:title" content="Poker Blindlevel Manager | URage Tools">
<meta property="og:description" content="Manage blinds and levels for your home poker tournaments.">
<meta property="og:image" content="https://urage.net/tools/game/poker-blindlevel-manager/thumbnail.png">
<meta property="og:image:alt" content="Poker Blindlevel Manager preview">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Poker Blindlevel Manager | URage Tools">
<meta name="twitter:description" content="Manage blinds and levels for your home poker tournaments.">
<meta name="twitter:image" content="https://urage.net/tools/game/poker-blindlevel-manager/thumbnail.png">
</head>
<body data-dashboard-theme="fire">

<nav>
    <button class="tab-btn active" onclick="showTab('clock', event)">Clock</button>
    <button class="tab-btn" onclick="showTab('structure', event)">Structure</button>
    <button class="tab-btn" onclick="showTab('players', event)">Players</button>
    <button class="tab-btn" onclick="showTab('payouts', event)">Payouts</button>
    <button class="tab-btn" onclick="showTab('settings', event)">Setup</button>
</nav>

<div class="container">
    
    <div id="view-clock" class="view active">
        <div class="dashboard-grid">
            <div class="main-display">
                <div id="level-label" style="color: var(--accent); font-weight: bold; letter-spacing: 2px;">LEVEL 1</div>
                <div class="timer" id="timer-text">00:00</div>
                <div class="blinds-banner" id="blind-text">--- / ---</div>
                <div id="ante-text" style="font-size: 1.2rem; color: var(--muted);">NO ANTE</div>
                
                <div style="margin-top: 30px; display: flex; gap: 10px; justify-content: center;">
                    <button class="action" id="play-btn" onclick="toggleClock()">START</button>
                    <button class="action secondary" onclick="changeLevel(-1, true)">PREV</button>
                    <button class="action secondary" onclick="changeLevel(1, true)">NEXT</button>
                </div>
            </div>

            <div class="stat-sidebar">
                <div><small style="color: var(--accent)">NEXT</small><div id="next-blind" style="font-size: 1.4rem; font-weight: bold;">---</div></div>
                <hr style="border:0; border-top:1px solid #333">
                <div><small style="color: var(--accent)">PLAYERS</small><div id="players-ratio" style="font-size: 1.4rem; font-weight: bold;">0 / 0</div></div>
                <div><small style="color: var(--accent)">AVG STACK</small><div id="avg-stack" style="font-size: 1.4rem; font-weight: bold;">0</div></div>
                <hr style="border:0; border-top:1px solid #333">
                <div><small style="color: var(--accent)">RUNTIME</small><div id="total-runtime" style="font-size: 1.4rem; font-weight: bold;">00:00:00</div></div>
            </div>
        </div>
        <div id="clock-chip-legend" style="display:flex; justify-content:center; gap:15px; margin-top:30px; flex-wrap:wrap;"></div>
    </div>

    <div id="view-structure" class="view">
        <div class="main-display" style="text-align: left; padding: 20px;">
            <h2 style="color: var(--accent); margin-bottom: 20px;">Structure Sheet</h2>
            <table>
                <thead><tr><th>Level</th><th>Blinds</th><th>Ante</th><th>Tournament Time</th></tr></thead>
                <tbody id="structure-body"></tbody>
            </table>
        </div>
    </div>

    <div id="view-players" class="view">
        <div class="main-display" style="text-align: left; padding: 20px;">
            <h2 style="color: var(--accent)">Player Management</h2>
            <div style="display:flex; gap:10px; margin: 20px 0;">
                <input type="text" id="player-name-input" placeholder="Player Name..." style="flex:1; padding:12px; background:#222; border:1px solid #444; color:#fff; border-radius:6px;">
                <button class="action" onclick="addPlayer()">Add Player</button>
            </div>
            <div id="active-players-list"></div>
            <h3 style="margin: 20px 0 10px; font-size:0.9rem; color:var(--danger)">Out</h3>
            <div id="busted-players-list"></div>
        </div>
    </div>

    <div id="view-payouts" class="view">
        <div class="main-display" style="text-align: left;">
            <h2 style="color: var(--accent)">Prize Pool & Results</h2>
            <div style="font-size: 3rem; font-weight: 800; color: var(--success); margin: 10px 0;" id="total-pool">$0</div>
            <table><tbody id="payout-body"></tbody></table>
            <button class="action" style="margin-top: 30px; width: 100%;" onclick="exportTournamentData()">Download Tournament Summary (.txt)</button>
        </div>
    </div>

    <div id="view-settings" class="view">
        <div class="main-display" style="text-align: left;">
            <h2 style="color: var(--accent)">Tournament Setup</h2>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-top:20px;">
                <div class="input-box"><label>Level Mins</label><input type="number" id="set-time" value="20"></div>
                <div class="input-box"><label>Buy-in $</label><input type="number" id="set-buyin" value="50"></div>
                <div class="input-box"><label>Start SB</label><input type="number" id="set-sb" value="100"></div>
                <div class="input-box"><label>Starting Chips</label><input type="number" id="set-chips" value="10000"></div>
            </div>
            <button class="action" style="margin-top:30px; width:100%" onclick="applySettings()">Save & Reset All Data</button>
        </div>
    </div>
</div>

<audio id="bell" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script src="script.js"></script>
<script src="../../shared/dashboard-current-output-autodescribe.js"></script>
</body>
</html>
