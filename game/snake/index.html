<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="../../shared/dashboard-theme.js"></script>
    <link rel="stylesheet" href="style.css">
<title>Snake | URage Tools</title>
<link rel="canonical" href="https://urage.net/tools/game/snake/">
<meta name="description" content="A retro Snake game with multiple AI strategies ranging from simple greedy behavior to a mathematically perfect solution.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="URage Tools">
<meta property="og:url" content="https://urage.net/tools/game/snake/">
<meta property="og:title" content="Snake | URage Tools">
<meta property="og:description" content="A retro Snake game with multiple AI strategies ranging from simple greedy behavior to a mathematically perfect solution.">
<meta property="og:image" content="https://urage.net/tools/game/snake/thumbnail.png">
<meta property="og:image:alt" content="Snake preview">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Snake | URage Tools">

</head>
<body data-dashboard-theme="fire">
    <h1>🐍 SNAKE AI</h1>
    
    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <!-- Start Screen -->
        <div id="startModal" class="modal">
            <h2>PRESS ANY ARROW KEY TO START</h2>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverModal" class="modal" style="display: none;">
            <h2 style="color: red;">GAME OVER</h2>
            <p style="font-size: 18px; margin-bottom: 15px;">Score: <span id="finalScore">0</span></p>
            <button onclick="resetGame()">PLAY AGAIN</button>
        </div>
    </div>

    <div class="ui-panel">
        <span>🏆 High Score: <b id="highScore">0</b></span>
        <span>📊 Score: <b id="scoreBoard">0</b></span>
        <span>⚡ Speed: <b id="speedDisplay">1x</b></span>
    </div>

    <!-- Controls -->
    <div class="controls">
        <button onclick="toggleAI()" id="aiBtn" class="ai-mode">🤖 AI MODE: OFF</button>
		<button onclick="cycleAI()" id="modeBtn">MODE: BALANCED</button>
        <span style="font-size: 12px; color: #aaa;">Use Arrow Keys or Toggle AI</span>
    </div>

    <script src="script.js"></script>
    <script src="../../shared/dashboard-current-output-autodescribe.js"></script>
</body>
</html>
